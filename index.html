    function buildReadingTokens(audioText, gloss) {
        const tokens = [];
        const parts = audioText.split(/(\n+| +|[.,!?;:…]+)/);
        for (const part of parts) {
            if (!part) continue;
            if (/^\n+$/.test(part)) {
                tokens.push({ w: '\n', t: null, breakSize: part.length > 1 ? 2 : 1 });
                continue;
            }
            if (/^ +$/.test(part)) {
                tokens.push({ w: ' ', t: null });
                continue;
            }
            if (/^[.,!?;:…]+$/.test(part)) {
                tokens.push({ w: part, t: null });
                continue;
            }
            const key = part.toLowerCase();
            tokens.push({ w: part, t: gloss[key] || gloss[part] || null });
        }
        return tokens;
    }

    function appendPhraseTokens(tokens, text, gloss) {
        const parts = text.split(/( +|[.,!?;:…]+)/);
        for (const part of parts) {
            if (!part) continue;
            if (/^ +$/.test(part)) {
                tokens.push({ w: ' ', t: null });
                continue;
            }
            if (/^[.,!?;:…]+$/.test(part)) {
                tokens.push({ w: part, t: null });
                continue;
            }
            const key = part.toLowerCase();
            tokens.push({ w: part, t: gloss[key] || gloss[part] || null });
        }
    }

    function buildDialogueTokens(lines, gloss) {
        const tokens = [];
        lines.forEach((line, lineIdx) => {
            if (lineIdx > 0) {
                tokens.push({ w: '\n', t: null, breakSize: 1, role: 'turn' });
            }
            tokens.push({ w: line.speaker + ':', t: null, role: 'speaker' });
            tokens.push({ w: ' ', t: null });
            appendPhraseTokens(tokens, line.text, gloss);
            if (line.t) {
                tokens.push({ w: '', t: line.t, role: 'translation' });
            }
        });
        return tokens;
    }

    function buildSentenceTokens(sentences, gloss) {
        const tokens = [];
        sentences.forEach((sentence, idx) => {
            if (idx > 0) {
                tokens.push({ w: '\n', t: null, breakSize: 1, role: 'sentence' });
            }
            appendPhraseTokens(tokens, sentence.text, gloss);
            if (sentence.t) {
                tokens.push({ w: '', t: sentence.t, role: 'translation' });
            }
        });
        return tokens;
    }

    function isReadingContentWord(token) {
        if (!token || !token.w) return false;
        if (token.role === 'speaker' || token.role === 'translation') return false;
        if (token.w === ' ' || token.w === '\n') return false;
        if (/^[.,!?;:…]+$/.test(token.w)) return false;
        return true;
    }

        readingShowTranslation = !!show;
        localStorage.setItem('reading-show-translation', readingShowTranslation ? '1' : '0');
        if (currentTab === 'reading' && readingViewMode === 'text') {
            renderReadingTextView();
        }
    }

    // 1. УМНЫЙ СБОРЩИК ГЛОБАЛЬНОГО СЛОВАРЯ (С ПРИОРИТЕТАМИ И БЕЗ ДУБЛИКАТОВ)
    function getWordDedupKeys(item) {
        const full = item.w.toLowerCase().trim();
        const parts = full.split('/').map(p => p.replace(/\(.*?\)/g, '').trim()).filter(Boolean);
        return parts.length > 0 ? [...new Set([full, ...parts])] : [full];
    }

    function createWordCollector() {
        const allWords = [];
        const seen = new Set();

        function addWord(item) {
            const keys = getWordDedupKeys(item);
            if (keys.some(k => seen.has(k))) return;
            keys.forEach(k => seen.add(k));
            allWords.push(item);
        }

        return { allWords, addWord };
    }

    function getGlobalDictionary() {
        const { allWords, addWord } = createWordCollector();

        Object.values(vocabularyData).forEach(arr => arr.forEach(addWord));
        pronounsData.forEach(addWord);
        Object.values(vowelsData).forEach(group => group.data.forEach(l => l.tones.forEach(addWord)));
        Object.values(consonantsData).forEach(group => group.data.forEach(l => l.tones.forEach(addWord)));

        return allWords;
    }

    function takeCategoryAgeSlice(arr, mode) {
        if (!arr || arr.length === 0) return [];
        if (mode === 'all') return arr;
        const count = Math.max(1, Math.ceil(arr.length * 0.3));
        if (mode === 'new') return arr.slice(-count);
        if (mode === 'old') return arr.slice(0, count);
        return arr;
    }

    function getTrainerDictionary() {
        if (trainerAgeMode === 'all' && trainerSelectedCategories.length === 0) {
            return getGlobalDictionary();
        }

        const categoryIds = trainerSelectedCategories.length === 0
            ? VOCAB_CATEGORY_IDS
            : trainerSelectedCategories;

        const { allWords, addWord } = createWordCollector();
        categoryIds.forEach(id => {
            const arr = vocabularyData[id];
            if (!arr) return;
            takeCategoryAgeSlice(arr, trainerAgeMode).forEach(addWord);
        });

        return allWords;
    }

    function stripVietnameseTones(str) {
        return str.toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/đ/g, 'd')
            .replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g, 'a')
            .replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g, 'e')
            .replace(/ì|í|ị|ỉ|ĩ/g, 'i')
            .replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g, 'o')
            .replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g, 'u')
            .replace(/ỳ|ý|ỵ|ỷ|ỹ/g, 'y');
    }

    function normalizeSearchText(str) {
        return stripVietnameseTones(str).replace(/\s+/g, ' ').trim();
    }

    function matchesVocabSearch(item, query) {
        const q = query.toLowerCase();
        const qPlain = normalizeSearchText(query);
        if (!q) return true;

        const wordVi = item.w.toLowerCase();
        const wordViPlain = normalizeSearchText(item.w);
        const transRu = item.t?.ru ? item.t.ru.toLowerCase() : '';
        const transEn = item.t?.en ? item.t.en.toLowerCase() : '';

        if (wordVi.includes(q) || wordViPlain.includes(qPlain)) return true;
        if (transRu.includes(q) || transEn.includes(q)) return true;
        if (qPlain && (transRu.includes(qPlain) || transEn.includes(qPlain))) return true;

        const viParts = item.w.split(/[/,()]/).map(p => p.trim()).filter(Boolean);
        return viParts.some(part => {
            const partLower = part.toLowerCase();
            const partPlain = normalizeSearchText(part);
            return partLower.includes(q) || partPlain.includes(qPlain);
        });
    }

    let currentObjectUrl = null;

    async function play(text, btn, filenameOverride) {
        if(btn) btn.classList.add('playing');
        
        if (tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred) {
            tg.HapticFeedback.impactOccurred('light');
        }
        
        if(btn) setTimeout(() => btn.classList.remove('playing'), 200);
        
        if (!isUnlocked) { 
            try {
                globalAudio.play().catch(() => {});
            } catch(e){} 
            isUnlocked = true; 
        }
        
        let filename = '';
        if (filenameOverride) {
            filename = filenameOverride;
        } else {
            let cleanText = text.replace(/\s*\(.*?\)\s*/g, ' ').trim();
            if (cleanText === 'áh') {
                filename = 'am_a_ngan';
            } else if (cleanText === 'ớ') {
                filename = 'am_a_mu';
            } else if (cleanText === 'Ý') {
                filename = 'am_y_dai';
            } else {
                cleanText = cleanText.toLowerCase();
                let encoded = encodeURIComponent(cleanText);
                let safeName = encoded.replace(/%/g, '_').replace(/[^a-z0-9_]/gi, '_');
                filename = safeName.replace(/_+/g, '_').replace(/^_|_$/g, '');
            }
        }

        const url = `./audio_0.75/${filename}.mp3`;

        try {
            // 1. Открываем наш явный кэш
            const cacheName = `audio-offline-ready-${APP_VERSION}`;
            const cache = await caches.open(cacheName);
            let response = await cache.match(url);
            
            // 2. Если аудио еще нет в кэше, грузим из сети и СРАЗУ сохраняем
            if (!response) {
                response = await fetch(url);
                if (response.ok) {
                    await cache.put(url, response.clone());
                }
            }

            // 3. Превращаем аудио в Blob (кусок памяти) для мгновенного старта
            if (response && response.ok) {
                const blob = await response.blob();
                
                // Очищаем старый звук из памяти, чтобы не засорять телефон
                if (currentObjectUrl) {
                    URL.revokeObjectURL(currentObjectUrl);
                }
                currentObjectUrl = URL.createObjectURL(blob);
                
                globalAudio.src = currentObjectUrl;
                globalAudio.playbackRate = currentPlaybackSpeed; 
                
                globalAudio.play().catch(e => {
                    console.error("Ошибка аудио:", e);
                });
            }
        } catch (error) {
            // Если кэш недоступен (например, режим инкогнито), fallback на обычный способ
            globalAudio.src = url;
            globalAudio.playbackRate = currentPlaybackSpeed; 
            globalAudio.play().catch(()=>{});
        }
    }

    }

    function shuffleArray(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function initTrainerData() {
        const allWords = getTrainerDictionary();
        if (allWords.length === 0) {
            trainerLeft = [];
            trainerRight = [];
            return;
        }
        let shuffled = shuffleArray([...allWords]);
        const count = Math.min(6, shuffled.length);
        let selected = shuffled.slice(0, count);
        
        trainerLeft = [...selected];
        trainerRight = shuffleArray([...selected]);
    }

    function getTrainerBtnClass(side, index) {
        let base = 'bg-tg-secondaryBg border-2 border-tg-hint/20 rounded-xl p-3 min-h-[72px] flex items-center justify-center shadow-sm transition-all duration-300 w-full overflow-hidden active:scale-95';
        let isSelected = (side === 'left' && tSelectedLeft === index) || (side === 'right' && tSelectedRight === index);
        
        if (isSelected) {
            base += ' border-tg-primary bg-tg-primary/10 text-tg-primary';
        } else {
            base += ' text-tg-text';
        }
        return base;
    }

    function updateTrainerBtnContent(side, i) {
        const btn = document.getElementById(`t-${side}-${i}`);
        if (!btn) return;
        
        if (side === 'left') {
            btn.innerHTML = `<span class="font-black text-lg text-center leading-tight">${trainerLeft[i].w}</span>`;
        } else {
            let iconContent = '';
            if (trainerRight[i].e) {
                iconContent = trainerRight[i].e;
            } else if (trainerRight[i].isSvg) {
                iconContent = `<span class="icon-wrap w-5 h-5 inline-block align-middle">${trainerRight[i].i}</span>`;
            } else {
                iconContent = trainerRight[i].i;
            }
            const transText = trainerRight[i].t[currentLang] || trainerRight[i].t['en'];
            btn.innerHTML = `<div class="flex items-center gap-2 w-full"><span class="text-xl shrink-0 flex items-center justify-center">${iconContent}</span><span class="text-[0.8rem] font-bold text-left leading-tight line-clamp-2">${transText}</span></div>`;
        }
    }

    function drawTrainerColumns() {
        const leftCol = document.getElementById('trainer-left-col');
        const rightCol = document.getElementById('trainer-right-col');
        if (!leftCol || !rightCol) return;

        leftCol.innerHTML = '';
        rightCol.innerHTML = '';

        const count = trainerLeft.length;
        if (count === 0) {
            const empty = document.createElement('div');
            empty.className = 'col-span-2 text-center text-tg-hint text-sm py-8';
            empty.textContent = currentLang === 'ru' ? 'Нет слов в выбранных темах' : 'No words in selected themes';
            leftCol.parentElement.appendChild(empty);
            return;
        }

        for(let i = 0; i < count; i++) {
            const lBtn = document.createElement('button');
            lBtn.id = `t-left-${i}`;
            lBtn.className = getTrainerBtnClass('left', i);
            lBtn.onclick = () => handleTrainerClick('left', i);
            leftCol.appendChild(lBtn);
            updateTrainerBtnContent('left', i);

            const rBtn = document.createElement('button');
            rBtn.id = `t-right-${i}`;
            rBtn.className = getTrainerBtnClass('right', i);
            rBtn.onclick = () => handleTrainerClick('right', i);
            rightCol.appendChild(rBtn);
            updateTrainerBtnContent('right', i);
        }
    }

    function handleTrainerClick(side, index) {
        // Убрали проверку tIsAnimating! Теперь глобальной паузы нет.
        
        // Если кнопка в данный момент исчезает (зеленая или красная), игнорируем клик по ней
        const clickedBtn = document.getElementById(`t-${side}-${index}`);
        if (clickedBtn && clickedBtn.disabled) return;

        if (side === 'left') {
            if (tSelectedLeft === index) {
                tSelectedLeft = -1; 
            } else {
                tSelectedLeft = index;
                play(trainerLeft[index].w, null); // Звук воспроизводится мгновенно
            }
        } else {
            if (tSelectedRight === index) {
                tSelectedRight = -1;
            } else {
                tSelectedRight = index;
            }
        }

        // Обновляем визуальное выделение (рамки), НО не трогаем те кнопки, которые уже анимируются
        for (let i = 0; i < trainerLeft.length; i++) {
            const lBtn = document.getElementById(`t-left-${i}`);
            const rBtn = document.getElementById(`t-right-${i}`);
            if (lBtn && !lBtn.disabled) lBtn.className = getTrainerBtnClass('left', i);
            if (rBtn && !rBtn.disabled) rBtn.className = getTrainerBtnClass('right', i);
        }

        if (tSelectedLeft !== -1 && tSelectedRight !== -1) {
            checkTrainerMatch();
        }
    }

    function checkTrainerMatch() {
        const lIndex = tSelectedLeft;
        const rIndex = tSelectedRight;
        
        const lWord = trainerLeft[lIndex].w;
        const rWord = trainerRight[rIndex].w;

        const lBtn = document.getElementById(`t-left-${lIndex}`);
        const rBtn = document.getElementById(`t-right-${rIndex}`);

        // СРАЗУ сбрасываем выбор! Это позволяет мгновенно кликать на другие слова.
        tSelectedLeft = -1;
        tSelectedRight = -1;

        if (lWord === rWord) {
            // Блокируем ИМЕННО ЭТУ пару кнопок, чтобы по ним нельзя было кликнуть во время анимации
            lBtn.disabled = true;
            rBtn.disabled = true;

            lBtn.className = 'bg-green-500/20 border-2 border-green-500 text-green-500 rounded-xl p-3 min-h-[72px] flex items-center justify-center shadow-sm transition-all duration-500 w-full overflow-hidden scale-[1.02]';
            rBtn.className = 'bg-green-500/20 border-2 border-green-500 text-green-500 rounded-xl p-3 min-h-[72px] flex items-center justify-center shadow-sm transition-all duration-500 w-full overflow-hidden scale-[1.02]';
            
            if (tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred) {
                tg.HapticFeedback.notificationOccurred('success');
            }

            setTimeout(() => {
                lBtn.style.opacity = '0';
                lBtn.style.transform = 'scale(0.8)';
                rBtn.style.opacity = '0';
                rBtn.style.transform = 'scale(0.8)';
                
                setTimeout(() => {
                    const currentWordsOnScreen = [...trainerLeft.map(i => i.w)];
                    const newWord = getRandomWord(currentWordsOnScreen);
                    
                    trainerLeft[lIndex] = newWord;
                    trainerRight[rIndex] = newWord;
                    
                    updateTrainerBtnContent('left', lIndex);
                    updateTrainerBtnContent('right', rIndex);
                    
                    lBtn.className = getTrainerBtnClass('left', lIndex);
                    rBtn.className = getTrainerBtnClass('right', rIndex);
                    
                    void lBtn.offsetWidth;
                    void rBtn.offsetWidth;
                    
                    lBtn.style.opacity = '1';
                    lBtn.style.transform = 'scale(1)';
                    rBtn.style.opacity = '1';
                    rBtn.style.transform = 'scale(1)';
                    
                    setTimeout(() => {
                        lBtn.style = '';
                        rBtn.style = '';
                        // После появления новых слов, разблокируем кнопки
                        lBtn.disabled = false;
                        rBtn.disabled = false;
                    }, 500);
                }, 500);
            }, 800);

        } else {
            // Если ошибка, тоже блокируем только эти две карточки на время "тряски" (0.5 сек)
            lBtn.disabled = true;
            rBtn.disabled = true;

            lBtn.className = 'bg-red-500/20 border-2 border-red-500 text-red-500 rounded-xl p-3 min-h-[72px] flex items-center justify-center shadow-sm transition-all w-full overflow-hidden shake-anim';
            rBtn.className = 'bg-red-500/20 border-2 border-red-500 text-red-500 rounded-xl p-3 min-h-[72px] flex items-center justify-center shadow-sm transition-all w-full overflow-hidden shake-anim';
            
            if (tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred) {
                tg.HapticFeedback.notificationOccurred('error');
            }

            setTimeout(() => {
                lBtn.className = getTrainerBtnClass('left', lIndex);
                rBtn.className = getTrainerBtnClass('right', rIndex);
                lBtn.disabled = false;
                rBtn.disabled = false;
            }, 500);
        }
    }

    function trainerReroll() {
        if (tIsAnimating) return;
        closeTrainerFilterMenu();
        initTrainerData();
        tSelectedLeft = -1;
        tSelectedRight = -1;
        renderTrainerSection();
    }
    // ==========================================

    // === ЧТЕНИЕ ТЕКСТОВ ===
    function getReadingFilterLabel() {
        if (readingSelectedCategories.length === 0) {
            return uiLabels[currentLang].allThemes;
        }
        if (readingSelectedCategories.length === 1) {
            return uiLabels[currentLang][readingSelectedCategories[0]];
        }
        return uiLabels[currentLang].themesCount(readingSelectedCategories.length);
    }

    function getFilteredReadings() {
        if (readingSelectedCategories.length === 0) return readingData;
        return readingData.filter(item => readingSelectedCategories.includes(item.category));
    }

    function toggleReadingCategory(categoryId) {
        if (categoryId === 'all') {
            readingSelectedCategories = [];
            readingFilterOpen = false;
        } else {
            const idx = readingSelectedCategories.indexOf(categoryId);
            if (idx >= 0) {
                readingSelectedCategories.splice(idx, 1);
            } else {
                readingSelectedCategories.push(categoryId);
            }
            readingFilterOpen = true;
        }
        readingViewMode = 'list';
        readingActiveId = null;
        readingPageIndex = 0;
        stopReadingAudio(true);
        renderReadingSection();
    }

    function toggleReadingFilterMenu(event) {
        if (event) event.stopPropagation();
        readingFilterOpen = !readingFilterOpen;
        const menu = document.getElementById('reading-filter-menu');
        const chevron = document.getElementById('reading-filter-chevron');
        if (menu) menu.classList.toggle('open', readingFilterOpen);
        if (chevron) chevron.style.transform = readingFilterOpen ? 'rotate(180deg)' : 'rotate(0deg)';

    function closeReadingFilterMenu() {

        readingFilterOpen = false;
        const menu = document.getElementById('reading-filter-menu');
        const chevron = document.getElementById('reading-filter-chevron');
        if (menu) menu.classList.remove('open');

    function openReadingText(id) {
        readingActiveId = id;
        readingViewMode = 'text';
        closeReadingFilterMenu();
        hideReadingTooltip();
        stopReadingAudio(true);
        renderReadingSection();
    }

    function backToReadingList() {
        readingViewMode = 'list';
        readingActiveId = null;
        hideReadingTooltip();
        stopReadingAudio(true);
        renderReadingSection();
    }

    function createReadingListButton(item) {
        let preview = '';
        if (item.lines && item.lines.length) {
            const first = item.lines[0];
            preview = `${first.speaker}: ${first.text}`;
        } else {
            preview = item.audioText.split(/[.!?]/)[0].trim();

        const catLabel = uiLabels[currentLang][item.category] || item.category;
        const btn = document.createElement('button');
        btn.type = 'button';

        btn.onclick = () => openReadingText(item.id);
        btn.innerHTML = `
            <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                    <div class="font-bold text-tg-text text-sm leading-snug">${item.title[currentLang] || item.title.en}</div>
                    <div class="text-tg-hint text-xs mt-1 line-clamp-2 leading-relaxed">${preview}…</div>
                </div>
                <span class="shrink-0 text-[10px] font-bold uppercase tracking-wide text-tg-primary/80 bg-tg-primary/10 px-2 py-1 rounded-md">${catLabel}</span>
            </div>
        `;
        return btn;
    }

    function jumpReadingPage(index, { soft = false } = {}) {
        const items = getFilteredReadings();
        const totalPages = Math.max(1, Math.ceil(items.length / READING_PAGE_SIZE));
        const next = Math.max(0, Math.min(totalPages - 1, index));

        if (!soft) {
            readingPageIndex = next;
            renderReadingListView();
            return;
        }

        if (next === readingPageIndex) return;
        readingPageIndex = next;

        const list = document.getElementById('reading-list');
        const pagerRow = mainContainer.querySelector('.pager-row');
        const dotsContainer = pagerRow?.querySelector('.pager-dots');
        const prevBtn = pagerRow?.querySelector('button:first-of-type');
        const nextBtn = pagerRow?.querySelector('button:last-of-type');

        if (!list || !dotsContainer) {
            renderReadingListView();
            return;
        }

        const pageItems = items.slice(
            readingPageIndex * READING_PAGE_SIZE,
            (readingPageIndex + 1) * READING_PAGE_SIZE
        );
        list.innerHTML = '';
        pageItems.forEach(item => list.appendChild(createReadingListButton(item)));
        syncPagerActiveState(dotsContainer, readingPageIndex, totalPages, prevBtn, nextBtn);
    }

    function navigateReadingPage(direction) {
        const items = getFilteredReadings();
        const totalPages = Math.max(1, Math.ceil(items.length / READING_PAGE_SIZE));
        const next = readingPageIndex + direction;
        if (next < 0 || next >= totalPages) return;
        jumpReadingPage(next);
    }

    function navigateReadingText(direction) {
        const items = getFilteredReadings();
        if (!items.length || !readingActiveId) return;
        const idx = items.findIndex(item => item.id === readingActiveId);
        if (idx < 0) return;
        const nextIdx = idx + direction;
        if (nextIdx < 0 || nextIdx >= items.length) return;
        openReadingText(items[nextIdx].id);
    }

    function handleReadingTextGesture() {
        const diffX = readingTouchEndX - readingTouchStartX;
        const diffY = readingTouchEndY - readingTouchStartY;
        const minSwipe = 50;
        if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > minSwipe) {
            // свайп влево → следующий, вправо → предыдущий
            if (diffX < 0) navigateReadingText(1);
            else navigateReadingText(-1);
        }
    }

    function handleReadingListGesture() {
        const diffX = readingTouchEndX - readingTouchStartX;
        const diffY = readingTouchEndY - readingTouchStartY;
        const minSwipe = 50;
        if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > minSwipe) {
            if (diffX < 0) navigateReadingPage(1);
            else navigateReadingPage(-1);
        }
    }

    function lookupReadingTranslation(token) {
        if (!token || !token.w || token.w.trim() === '' || token.w === '\n') return null;
        if (/^[.,!?;:…]+$/.test(token.w)) return null;
        if (token.t) return token.t[currentLang] || token.t.en || null;
        const key = token.w.toLowerCase();
        const dict = getGlobalDictionary();
        const found = dict.find(item => {
            const w = (item.w || '').toLowerCase().trim();
            return w === key || w.split('/').map(p => p.replace(/\(.*?\)/g, '').trim()).includes(key);
        });
        if (found && found.t) return found.t[currentLang] || found.t.en || null;
        return null;
    }

    function hideReadingTooltip() {
        const tip = document.getElementById('reading-tooltip');
        if (tip) tip.remove();
        document.querySelectorAll('.reading-word.selected').forEach(el => el.classList.remove('selected'));
    }

    function showReadingTooltip(wordEl, text) {
        hideReadingTooltip();
        if (!text) return;
        wordEl.classList.add('selected');
        const tip = document.createElement('div');
        tip.id = 'reading-tooltip';
        tip.className = 'reading-tooltip';
        tip.textContent = text;
        const wrap = document.getElementById('reading-text-wrap');
        if (!wrap) return;
        wrap.style.position = 'relative';
        wrap.appendChild(tip);
        const wrapRect = wrap.getBoundingClientRect();
        const wordRect = wordEl.getBoundingClientRect();
        let left = wordRect.left - wrapRect.left;
        let top = wordRect.bottom - wrapRect.top + 8;
        tip.style.left = left + 'px';
        tip.style.top = top + 'px';
        requestAnimationFrame(() => {
            const tipRect = tip.getBoundingClientRect();
            if (tipRect.right > wrapRect.right - 4) {
                tip.style.left = Math.max(0, wrapRect.width - tipRect.width - 4) + 'px';
            }
            if (tipRect.bottom > wrapRect.bottom + 40) {
                tip.style.top = (wordRect.top - wrapRect.top - tipRect.height - 8) + 'px';
            }
        });
    }

    function onReadingWordTap(event, index) {
        event.stopPropagation();
        const item = readingData.find(r => r.id === readingActiveId);
        if (!item) return;
        const token = item.tokens[index];
        if (!token || !isReadingContentWord(token)) return;
        const translation = lookupReadingTranslation(token);
        const wordEl = event.currentTarget;
        if (!translation) {
            hideReadingTooltip();
            return;
        }
        showReadingTooltip(wordEl, translation);
    }

    function clearReadingAudioListeners() {
        if (readingTimeUpdateHandler) {
            globalAudio.removeEventListener('timeupdate', readingTimeUpdateHandler);
            readingTimeUpdateHandler = null;
        }
        if (readingEndedHandler) {
            globalAudio.removeEventListener('ended', readingEndedHandler);
            readingEndedHandler = null;
        }
    }

    function stopReadingAudio(resetHighlight) {
        clearReadingAudioListeners();
        try { globalAudio.pause(); } catch (e) {}
        readingPlayingId = null;
        readingReplayAvailable = false;
        if (resetHighlight) resetReadingHighlight();
        updateReadingPlayButton();
        updateReadingReplayButton();
    }

    function resetReadingHighlight() {
        document.querySelectorAll('#reading-body .reading-word').forEach(el => {
            el.classList.remove('read', 'active');
        });
    }

    function updateReadingHighlight() {
        const item = readingData.find(r => r.id === readingActiveId);
        if (!item) return;
        const duration = globalAudio.duration;
        if (!duration || !isFinite(duration) || duration <= 0) return;

        const progress = Math.min(1, Math.max(0, globalAudio.currentTime / duration));
        const wordTokens = item.tokens
            .map((t, i) => ({ t, i }))
            .filter(x => isReadingContentWord(x.t));

        if (wordTokens.length === 0) return;
        const totalChars = wordTokens.reduce((sum, x) => sum + x.t.w.length, 0) || 1;
        const target = progress * totalChars;
        let acc = 0;
        let activeIdx = wordTokens[wordTokens.length - 1].i;
        for (const x of wordTokens) {
            acc += x.t.w.length;
            if (target <= acc) {
                activeIdx = x.i;
                break;
            }
        }

        document.querySelectorAll('#reading-body .reading-word').forEach(el => {
            const idx = Number(el.dataset.idx);
            el.classList.remove('read', 'active');
            if (idx < activeIdx) el.classList.add('read');
            else if (idx === activeIdx) el.classList.add('active');
        });
    }

    function updateReadingPlayButton() {
        const btn = document.getElementById('reading-play-btn');
        const icon = document.getElementById('reading-play-icon');
        if (!btn || !icon) return;
        const playing = readingPlayingId === readingActiveId && !globalAudio.paused;
        btn.setAttribute('aria-label', playing ? uiLabels[currentLang].readingPause : uiLabels[currentLang].readingPlay);
        btn.title = playing ? uiLabels[currentLang].readingPause : uiLabels[currentLang].readingPlay;
        icon.innerHTML = playing
            ? '<rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect>'
            : '<polygon points="7,5 19,12 7,19"></polygon>';
    }

    function updateReadingReplayButton() {
        const stack = document.getElementById('reading-play-stack');
        const btn = document.getElementById('reading-replay-btn');
        if (!stack || !btn) return;
        const show = readingReplayAvailable && readingActiveId;
        stack.classList.toggle('has-replay', show);
        if (show) {
            requestAnimationFrame(() => btn.classList.add('visible'));
        } else {
            btn.classList.remove('visible');
        }
    }

    function attachReadingAudioListeners(item) {
        clearReadingAudioListeners();
        readingTimeUpdateHandler = () => updateReadingHighlight();
        readingEndedHandler = () => {
            readingPlayingId = null;
            document.querySelectorAll('#reading-body .reading-word').forEach(el => {
                el.classList.remove('active');
                el.classList.add('read');
            });
            updateReadingPlayButton();
            updateReadingReplayButton();
        };
        globalAudio.addEventListener('timeupdate', readingTimeUpdateHandler);
        globalAudio.addEventListener('ended', readingEndedHandler);
    }

    async function startReadingPlayback(item) {
        resetReadingHighlight();
        readingPlayingId = item.id;
        readingReplayAvailable = true;
        attachReadingAudioListeners(item);
        await play(item.audioText, null, getReadingAudioKey(item));
        updateReadingPlayButton();
        updateReadingReplayButton();
    }

    async function toggleReadingPlayback() {
        const item = readingData.find(r => r.id === readingActiveId);
        if (!item) return;

        if (readingPlayingId === item.id && !globalAudio.paused) {
            globalAudio.pause();
            updateReadingPlayButton();
            return;
        }

        if (readingPlayingId === item.id && globalAudio.paused && globalAudio.src) {
            try {
                await globalAudio.play();
            } catch (e) {}
            updateReadingPlayButton();
            updateReadingReplayButton();
            return;
        }

        await startReadingPlayback(item);
    }

    async function restartReadingPlayback() {
        const item = readingData.find(r => r.id === readingActiveId);
        if (!item) return;

        resetReadingHighlight();
        if (readingPlayingId === item.id && globalAudio.src) {
            try {
                globalAudio.currentTime = 0;
                await globalAudio.play();
            } catch (e) {}
            updateReadingPlayButton();
            updateReadingReplayButton();
            return;
        }

        await startReadingPlayback(item);
    }

    function renderReadingSection() {
        if (readingViewMode === 'text' && readingActiveId) {
            renderReadingTextView();
        } else {
            renderReadingListView();
        }
    }

    function renderReadingListView() {
        mainContainer.innerHTML = '';
        mainContainer.classList.remove('animate-fade-in');
        void mainContainer.offsetWidth;
        mainContainer.classList.add('animate-fade-in');

        const categories = getVocabCategoryList();
        const isAll = readingSelectedCategories.length === 0;
        const filterLabel = getReadingFilterLabel();
        const items = getFilteredReadings();

        const categoryOptionsHtml = categories.map(cat => {
            const selected = readingSelectedCategories.includes(cat.id);
            return `
                <button type="button" class="trainer-filter-option ${selected ? 'selected' : ''}" onclick="toggleReadingCategory('${cat.id}')">
                    <span class="check">✓</span>
                    <span>${cat.label}</span>
                </button>
            `;

    function scrollPagerDotIntoView(dotsContainer) {
        if (!dotsContainer) return;
        const active = dotsContainer.querySelector('[data-active="1"]');
        if (!active) return;
        requestAnimationFrame(() => {
            const track = dotsContainer;
            const left = active.offsetLeft - (track.clientWidth - active.offsetWidth) / 2;
            track.scrollLeft = Math.max(0, left);
        });
    }

    function syncPagerActiveState(dotsContainer, activeIndex, totalPages, prevBtn, nextBtn) {
        if (!dotsContainer) return;
        dotsContainer.querySelectorAll('.pager-dot').forEach((dot, i) => {
            if (i === activeIndex) dot.dataset.active = '1';
            else delete dot.dataset.active;
        });
        if (prevBtn) {
            const atStart = activeIndex <= 0;
            prevBtn.classList.toggle('opacity-30', atStart);
            prevBtn.classList.toggle('cursor-not-allowed', atStart);
            prevBtn.classList.toggle('pointer-events-none', atStart);
        }
        if (nextBtn) {
            const atEnd = activeIndex >= totalPages - 1;
            nextBtn.classList.toggle('opacity-30', atEnd);
            nextBtn.classList.toggle('cursor-not-allowed', atEnd);
            nextBtn.classList.toggle('pointer-events-none', atEnd);

        scrollPagerDotIntoView(dotsContainer);
    }

    function bindPagerScrub(dotsContainer, onSelectPage) {
        if (!dotsContainer || dotsContainer.dataset.scrubBound === '1') return;
        dotsContainer.dataset.scrubBound = '1';

        let scrubbing = false;
        let lastIndex = -1;

        const indexFromClientX = (clientX) => {
            const total = dotsContainer.querySelectorAll('.pager-dot').length;
            if (total <= 0) return null;
            const rect = dotsContainer.getBoundingClientRect();
            if (rect.width <= 0) return null;
            const ratio = (clientX - rect.left) / rect.width;
            const clamped = Math.min(1, Math.max(0, ratio));
            return Math.min(total - 1, Math.floor(clamped * total));
        };

        const applyFromEvent = (e) => {
            const idx = indexFromClientX(e.clientX);
            if (idx == null || idx === lastIndex) return;
            lastIndex = idx;
            onSelectPage(idx);
            try {
                if (tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged) {
                    tg.HapticFeedback.selectionChanged();
                }
            } catch (_) {}
        };

        dotsContainer.addEventListener('pointerdown', (e) => {
            if (e.button != null && e.button !== 0) return;
            scrubbing = true;
            lastIndex = -1;
            dotsContainer.classList.add('is-scrubbing');
            try { dotsContainer.setPointerCapture(e.pointerId); } catch (_) {}
            applyFromEvent(e);
            e.preventDefault();
        });

        dotsContainer.addEventListener('pointermove', (e) => {
            if (!scrubbing) return;
            applyFromEvent(e);
        });

        const endScrub = () => {
            if (!scrubbing) return;
            scrubbing = false;
            lastIndex = -1;
            dotsContainer.classList.remove('is-scrubbing');
        };

        dotsContainer.addEventListener('pointerup', endScrub);
        dotsContainer.addEventListener('pointercancel', endScrub);
    }

    function jumpVocabPage(index, { soft = false } = {}) {
        const currentData = getCurrentVocabWords();
        const isMobile = window.innerWidth < 640;
        const pageSize = isMobile ? 7 : 10;
        const totalPages = Math.max(1, Math.ceil(currentData.length / pageSize));
        const next = Math.max(0, Math.min(totalPages - 1, index));

        if (!soft) {
            vocabPageIndex = next;
            renderVocabPageOnly();
            return;
        }

        if (next === vocabPageIndex) return;
        vocabPageIndex = next;

        const pageContainer = document.getElementById('vocab-page-container');
        const vocabGrid = document.getElementById('vocab-grid');
        const dotsContainer = pageContainer?.querySelector('.pager-dots');
        const pagerRow = pageContainer?.querySelector('.pager-row');
        const prevBtn = pagerRow?.querySelector('button:first-of-type');
        const nextBtn = pagerRow?.querySelector('button:last-of-type');

        if (!vocabGrid || !dotsContainer) {
            renderVocabPageOnly();
            return;
        }

        const itemsToRender = currentData.slice(vocabPageIndex * pageSize, (vocabPageIndex + 1) * pageSize);
        fillVocabGrid(vocabGrid, itemsToRender);
        syncPagerActiveState(dotsContainer, vocabPageIndex, totalPages, prevBtn, nextBtn);
    }

    function handleGesture() {
        const diffX = touchEndX - touchStartX;
        const diffY = touchEndY - touchStartY;
        const minSwipe = 50;

        if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > minSwipe) {
            if (diffX < 0) {
                navigateVocabPage(1);
            } else {
                navigateVocabPage(-1);
            }
        }
    }

    function renderVocabPageOnly(filteredData = null, animateOrderFlip = false) {
        const pageContainer = document.getElementById('vocab-page-container');
        if (!pageContainer) return;

        pageContainer.innerHTML = '';
        
        if (!filteredData) {
            pageContainer.classList.remove('animate-fade-in', 'vocab-order-flip');
            void pageContainer.offsetWidth;
            pageContainer.classList.add(animateOrderFlip ? 'vocab-order-flip' : 'animate-fade-in');
        }

        const vocabGrid = document.createElement('div');
        vocabGrid.id = 'vocab-grid';
        vocabGrid.className = 'grid grid-cols-1 sm:grid-cols-2 gap-2.5 w-full pb-2 touch-pan-y';
        
        let itemsToRender = [];
        let showPagination = false;
        let totalPages = 1;

        if (filteredData) {
            itemsToRender = filteredData;
        } else {
            const currentData = getCurrentVocabWords();
            const isMobile = window.innerWidth < 640;
            const pageSize = isMobile ? 7 : 10;
            totalPages = Math.ceil(currentData.length / pageSize);
            
            if (vocabPageIndex >= totalPages) vocabPageIndex = 0;
            
            itemsToRender = currentData.slice(vocabPageIndex * pageSize, (vocabPageIndex + 1) * pageSize);
            showPagination = totalPages > 1;
        }

        fillVocabGrid(vocabGrid, itemsToRender);

        if (!filteredData) {
            vocabGrid.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, { passive: true });

            vocabGrid.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;
                touchEndY = e.changedTouches[0].screenY;
                handleGesture();
            }, { passive: true });
        }

        pageContainer.appendChild(vocabGrid);

        if (showPagination) {
            const paginationControls = document.createElement('div');
            paginationControls.className = 'pager-row mt-6 mb-8 select-none';

            const prevBtn = document.createElement('button');
            prevBtn.className = `shrink-0 p-2 rounded-xl border border-tg-hint/20 text-tg-text active:scale-95 transition-all ${vocabPageIndex === 0 ? 'opacity-30 cursor-not-allowed pointer-events-none' : ''}`;
            prevBtn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" /></svg>`;
            prevBtn.onclick = () => navigateVocabPage(-1);

            const dotsContainer = document.createElement('div');
            dotsContainer.className = 'pager-dots no-scrollbar';
            for (let i = 0; i < totalPages; i++) {
                const dot = document.createElement('button');
                const isActive = i === vocabPageIndex;
                dot.type = 'button';
                dot.className = 'pager-dot';
                dot.setAttribute('aria-label', `Page ${i + 1}`);
                if (isActive) dot.dataset.active = '1';
                dotsContainer.appendChild(dot);
            }
            bindPagerScrub(dotsContainer, (index) => jumpVocabPage(index, { soft: true }));

            const nextBtn = document.createElement('button');
            nextBtn.className = `shrink-0 p-2 rounded-xl border border-tg-hint/20 text-tg-text active:scale-95 transition-all ${vocabPageIndex === totalPages - 1 ? 'opacity-30 cursor-not-allowed pointer-events-none' : ''}`;
            nextBtn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" /></svg>`;
            nextBtn.onclick = () => navigateVocabPage(1);

            paginationControls.appendChild(prevBtn);
            paginationControls.appendChild(dotsContainer);
            paginationControls.appendChild(nextBtn);
            pageContainer.appendChild(paginationControls);
            scrollPagerDotIntoView(dotsContainer);
        }
    }

        currentTheme = theme;
        const root = document.documentElement;
        
        const palettes = {
            light: {
                '--tg-theme-bg-color': '#f0f4f8',
                '--tg-theme-text-color': '#2c3e50',
                '--tg-theme-hint-color': '#7f8c8d',
                '--tg-theme-button-color': '#1976d2',
                '--tg-theme-button-text-color': '#ffffff',
                '--tg-theme-secondary-bg-color': '#ffffff'
            },
            dark: {
                '--tg-theme-bg-color': '#151f2b',
                '--tg-theme-text-color': '#f5f6f7',
                '--tg-theme-hint-color': '#7e8b9a',
                '--tg-theme-button-color': '#2481cc',
                '--tg-theme-button-text-color': '#ffffff',
                '--tg-theme-secondary-bg-color': '#1d2733'
            }
        };

        const colors = palettes[theme];
        for (const [key, val] of Object.entries(colors)) {
            root.style.setProperty(key, val);
        }
        
        localStorage.setItem('app-theme', theme);
        updateThemeIcon();

                localStorage.removeItem(key);

    updateLanguageUI();
    renderGrids(vowelsData);

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => {
                    console.log('Service Worker registered', reg);
                })
                .catch(err => console.error('Service Worker registration failed', err));
        });

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
                window.location.reload();
                refreshing = true;
            }
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
        if (localStorage.getItem('audio-offline-ready') === 'true') {
            const btn = document.getElementById('download-all-btn');
            const icon = document.getElementById('download-icon');
            const check = document.getElementById('download-check');
            
            if (btn && icon && check) {
                icon.classList.add('hidden');
                check.classList.remove('hidden');
                btn.disabled = true;
            }
        }
    });

async function downloadAllAudio() {
        const btn = document.getElementById('download-all-btn');
        const icon = document.getElementById('download-icon');
        const spinner = document.getElementById('download-spinner');
        const check = document.getElementById('download-check');

        // Включаем визуальную загрузку
        btn.disabled = true;
        icon.classList.add('hidden');
        spinner.classList.remove('hidden');

        try {
            const allWords = new Set();

            // Собираем все слова
            if (typeof vowelsData !== 'undefined') {
                Object.values(vowelsData).forEach(g => g.data.forEach(d => d.tones.forEach(t => allWords.add(t.w))));
            }
            if (typeof consonantsData !== 'undefined') {
                Object.values(consonantsData).forEach(g => g.data.forEach(d => d.tones.forEach(t => allWords.add(t.w))));
            }
            if (typeof pronounsData !== 'undefined') {
                pronounsData.forEach(item => allWords.add(item.w));
            }
            if (typeof vocabularyData !== 'undefined') {
                Object.values(vocabularyData).forEach(arr => arr.forEach(item => allWords.add(item.w)));
            }
            if (typeof globalDictionary !== 'undefined' && globalDictionary.length > 0) {
                globalDictionary.forEach(item => allWords.add(item.w));
            }
            const urlsToFetch = [];
            
            allWords.forEach(word => {
                let cleanText = word.toLowerCase();
                let encoded = encodeURIComponent(cleanText);
                let safeName = encoded.replace(/%/g, '_').replace(/[^a-z0-9_]/gi, '_');
                let filename = safeName.replace(/_+/g, '_').replace(/^_|_$/g, '');
                urlsToFetch.push(`./audio_0.75/${filename}.mp3`);
            });

            if (typeof readingData !== 'undefined') {
                readingData.forEach(item => {
                    if (item.id) urlsToFetch.push(`./audio_0.75/${getReadingAudioKey(item)}.mp3`);
                });
            }

            // ОТКРЫВАЕМ ХРАНИЛИЩЕ ДЛЯ ТЕКУЩЕЙ ВЕРСИИ
            const cacheName = `audio-offline-ready-${APP_VERSION}`;
            const cache = await caches.open(cacheName);

            // Скачиваем и гарантированно кладем в хранилище (Cache Storage)
            const batchSize = 15; 
            for (let i = 0; i < urlsToFetch.length; i += batchSize) {
                const batch = urlsToFetch.slice(i, i + batchSize);
                
                await Promise.all(batch.map(async url => {
                    try {
                        const cached = await cache.match(url);
                        if (!cached) { // Грузим, только если файла там еще нет
                            const response = await fetch(url);
                            if (response.ok) {
                                await cache.put(url, response);
                            }
                        }
                    } catch (e) {
                        console.log('Fetch skipped/failed:', url);
                    }
                }));
            }

            // Запоминаем успех
            localStorage.setItem(cacheName, 'true');

            // Показываем галочку
            spinner.classList.add('hidden');
            check.classList.remove('hidden');

        } catch (error) {
            console.error('Ошибка при скачивании базы:', error);
            alert('Не удалось скачать аудио. Проверьте подключение к интернету.');
            
            spinner.classList.add('hidden');
            icon.classList.remove('hidden');
            btn.disabled = false;
        }
    }
</script>
